<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identity Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4f46e5;
            --bg: #0f172a; 
            --card: #1e293b;
            --text: #f8fafc;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .profile-card {
            width: 100%;
            max-width: 400px;
            background: var(--card);
            border-radius: 24px;
            padding: 40px 24px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .logo-container {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 2px solid var(--primary);
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Changed to cover for a better look */
        }

        h1 { font-size: 1.5rem; margin: 0 0 5px 0; font-weight: 700; }
        .slogan { color: #94a3b8; font-size: 0.9rem; margin-bottom: 30px; display: block; font-style: italic; }

        .links-container { display: grid; gap: 12px; }

        .btn-link {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(255,255,255,0.03);
            text-decoration: none;
            color: white;
            padding: 16px 20px;
            border-radius: 12px;
            font-weight: 500;
            transition: 0.3s;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .btn-link:hover {
            background: var(--primary);
            transform: translateY(-3px);
            border-color: transparent;
        }

        .btn-link i { font-size: 1.2rem; width: 25px; text-align: center; }

        .footer { margin-top: 30px; font-size: 0.7rem; color: #475569; letter-spacing: 2px; text-transform: uppercase; }
    </style>
</head>
<body>

<div class="profile-card">
    <div class="logo-container" id="logo-box">
        <i class="fa-solid fa-briefcase" style="font-size: 40px; color: var(--primary);"></i>
    </div>
    
    <h1 id="p-name">Enterprise Hub</h1>
    <span class="slogan" id="p-slogan">Innovative Solutions</span>

    <div class="links-container" id="p-links">
        </div>

    <div class="footer">Powered by Biruk Design</div>
</div>

<script>
    window.onload = function() {
        const params = new URLSearchParams(window.location.search);
        
        // 1. Get Data from URL
        const customName = params.get('name');
        const customLogo = params.get('logo');
        const customSlogan = params.get('slogan');
        const dataStr = params.get('data');

        // 2. Apply Custom Name
        if (customName) {
            document.getElementById('p-name').innerText = decodeURIComponent(customName);
            document.title = decodeURIComponent(customName); // Updates browser tab title
        }

        // 3. Apply Custom Logo
        if (customLogo && customLogo !== "null" && customLogo !== "") {
            document.getElementById('logo-box').innerHTML = `<img src="${decodeURIComponent(customLogo)}" alt="Logo">`;
        }

        // 4. Apply Slogan
        if (customSlogan) {
            document.getElementById('p-slogan').innerText = decodeURIComponent(customSlogan);
        }

        // 5. Build Links
        if (dataStr) {
            const container = document.getElementById('p-links');
            const sections = decodeURIComponent(dataStr).split(' | ');
            
            const icons = {
                'Instagram': 'fa-instagram', 
                'TikTok': 'fa-tiktok', 
                'YouTube': 'fa-youtube',
                'Telegram': 'fa-telegram', 
                'WhatsApp': 'fa-whatsapp', 
                'Facebook': 'fa-facebook',
                'LinkedIn': 'fa-linkedin', 
                'X': 'fa-x-twitter', 
                'Portfolio': 'fa-globe'
            };

            sections.forEach(item => {
                const [name, val] = item.split(': ');
                if (!val) return;

                const a = document.createElement('a');
                a.className = 'btn-link';
                
                // Logic for WhatsApp numbers vs links
                if (name === 'WhatsApp' && !val.includes('http')) {
                    a.href = `https://wa.me/${val.replace(/\s+/g, '')}`;
                } else {
                    a.href = val.includes('http') ? val : `https://${val}`;
                }
                
                a.target = "_blank";
                
                const iconClass = icons[name] ? `fa-brands ${icons[name]}` : 'fa-solid fa-link';
                a.innerHTML = `<i class="${iconClass}"></i> ${name}`;
                container.appendChild(a);
            });
        } else {
            // Fallback message if no links are provided
            document.getElementById('p-links').innerHTML = `<p style="font-size:0.8rem; color:#64748b;">No contact links provided.</p>`;
        }
    }
</script>
</body>
</html>
