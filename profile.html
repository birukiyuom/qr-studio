<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identity Hub | Enterprise Edition</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6366f1;
            --bg-dark: #0f172a;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .hub-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            width: 100%;
            max-width: 400px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        .logo-container {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
            border-radius: 25px;
            border: 2px solid var(--primary);
            overflow: hidden;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 { margin: 10px 0 5px; font-size: 1.5rem; letter-spacing: -0.5px; }
        p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 30px; }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .action-button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 16px;
            border-radius: 16px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .action-button:hover {
            background: var(--primary);
            border-color: var(--primary);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
        }

        .footer {
            margin-top: 40px;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #475569;
        }
    </style>
</head>
<body>

<div class="hub-card">
    <div class="logo-container">
        <img id="display-logo" src="" alt="Logo">
    </div>
    <h1 id="display-name">Loading...</h1>
    <p id="display-slogan"></p>

    <div class="links-container" id="links-box">
        </div>

    <div class="footer">
        Powered by Biruk Design
    </div>
</div>

<script>
    // Logic to parse URL parameters and display data
    const params = new URLSearchParams(window.location.search);
    
    document.getElementById('display-name').innerText = params.get('name') || "Enterprise Hub";
    document.getElementById('display-slogan').innerText = params.get('slogan') || "Innovative Solutions";
    document.getElementById('display-logo').src = params.get('logo') || "https://via.placeholder.com/100";

    const data = params.get('data') || "";
    const linksBox = document.getElementById('links-box');

    if (data) {
        const links = data.split(' | ');
        links.forEach(link => {
            const [platform, value] = link.split(': ');
            const btn = document.createElement('a');
            btn.className = 'action-button';
            btn.href = value.includes('http') ? value : '#';
            
            // Icon mapping
            let icon = '<i class="fa-solid fa-link"></i>';
            if(platform.toLowerCase().includes('instagram')) icon = '<i class="fa-brands fa-instagram"></i>';
            if(platform.toLowerCase().includes('telegram')) icon = '<i class="fa-brands fa-telegram"></i>';
            if(platform.toLowerCase().includes('whatsapp')) icon = '<i class="fa-brands fa-whatsapp"></i>';
            if(platform.toLowerCase().includes('menu')) icon = '<i class="fa-solid fa-utensils"></i>';

            btn.innerHTML = `${icon} ${platform}`;
            linksBox.appendChild(btn);
        });
    }
</script>

</body>
</html>
