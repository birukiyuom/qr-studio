<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identity Hub | Biruk Design</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6366f1;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            background-attachment: fixed;
            color: white;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .hub-card {
            background: var(--glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 35px;
            width: 100%;
            max-width: 420px;
            padding: 45px 25px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
        }

        .logo-container {
            width: 120px;
            height: 120px;
            margin: 0 auto 25px;
            border-radius: 30px;
            border: 3px solid var(--primary);
            overflow: hidden;
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.3);
        }

        .logo-container img { width: 100%; height: 100%; object-fit: cover; }

        h1 { margin: 15px 0 5px; font-size: 1.8rem; font-weight: 800; }
        p { color: #94a3b8; margin-bottom: 35px; font-size: 0.95rem; }

        .links-container { display: flex; flex-direction: column; gap: 15px; }

        .action-button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 18px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .action-button:hover {
            background: var(--primary);
            transform: scale(1.05);
            box-shadow: 0 15px 30px rgba(99, 102, 241, 0.4);
        }

        .footer {
            margin-top: 50px;
            font-size: 0.75rem;
            letter-spacing: 3px;
            color: #475569;
            font-weight: 900;
        }
    </style>
</head>
<body>

<div class="hub-card">
    <div class="logo-container">
        <img id="display-logo" src="" alt="Logo" onerror="this.src='https://via.placeholder.com/150?text=No+Logo'">
    </div>
    <h1 id="display-name">Business Hub</h1>
    <p id="display-slogan"></p>

    <div class="links-container" id="links-box"></div>

    <div class="footer">POWERED BY BIRUK DESIGN</div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    document.getElementById('display-name').innerText = params.get('name') || "Business Identity";
    document.getElementById('display-slogan').innerText = params.get('slogan') || "Digital Solutions";
    
    if(params.get('logo')) {
        document.getElementById('display-logo').src = params.get('logo');
    }

    const rawData = params.get('data') || "";
    const box = document.getElementById('links-box');

    if (rawData) {
        rawData.split(' | ').forEach(item => {
            const parts = item.split(': ');
            if (parts.length < 2) return;
            
            const name = parts[0];
            const url = parts.slice(1).join(': ');
            
            const btn = document.createElement('a');
            btn.className = 'action-button';
            btn.href = url.startsWith('http') ? url : 'https://' + url;
            btn.target = "_blank";

            let icon = '<i class="fa-solid fa-link"></i>';
            const n = name.toLowerCase();
            if(n.includes('instagram')) icon = '<i class="fa-brands fa-instagram"></i>';
            if(n.includes('facebook')) icon = '<i class="fa-brands fa-facebook"></i>';
            if(n.includes('telegram')) icon = '<i class="fa-brands fa-telegram"></i>';
            if(n.includes('whatsapp')) icon = '<i class="fa-brands fa-whatsapp"></i>';
            if(n.includes('youtube')) icon = '<i class="fa-brands fa-youtube"></i>';
            if(n.includes('tiktok')) icon = '<i class="fa-brands fa-tiktok"></i>';
            if(n.includes('menu')) icon = '<i class="fa-solid fa-utensils"></i>';

            btn.innerHTML = `${icon} ${name}`;
            box.appendChild(btn);
        });
    }
</script>
</body>
</html>
