<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identity Hub | Enterprise Edition</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6366f1;
            --bg-dark: #0f172a;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .hub-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            width: 100%;
            max-width: 400px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        .logo-container {
            width: 110px;
            height: 110px;
            margin: 0 auto 20px;
            border-radius: 28px;
            border: 2px solid var(--primary);
            overflow: hidden;
            background: rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.2);
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 { margin: 10px 0 5px; font-size: 1.6rem; letter-spacing: -0.5px; }
        p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 30px; line-height: 1.4; }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .action-button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 18px;
            border-radius: 18px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .action-button:hover {
            background: var(--primary);
            border-color: var(--primary);
            transform: translateY(-3px);
            box-shadow: 0 12px 24px rgba(99, 102, 241, 0.3);
        }

        .footer {
            margin-top: 40px;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #475569;
            font-weight: 700;
        }
    </style>
</head>
<body>

<div class="hub-card">
    <div class="logo-container">
        <img id="display-logo" src="" alt="Logo" onerror="this.src='https://via.placeholder.com/150?text=No+Logo'">
    </div>
    <h1 id="display-name">Loading...</h1>
    <p id="display-slogan"></p>

    <div class="links-container" id="links-box">
        </div>

    <div class="footer">
        POWERED BY BIRUK DESIGN
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    
    // Set Header Info
    document.getElementById('display-name').innerText = params.get('name') || "Business Hub";
    document.getElementById('display-slogan').innerText = params.get('slogan') || "Professional Solutions";
    
    const logoSrc = params.get('logo');
    if(logoSrc) {
        document.getElementById('display-logo').src = logoSrc;
    }

    // Generate Buttons
    const data = params.get('data') || "";
    const linksBox = document.getElementById('links-box');

    if (data) {
        const links = data.split(' | ');
        links.forEach(link => {
            const parts = link.split(': ');
            if (parts.length < 2) return;
            
            const platform = parts[0];
            const value = parts.slice(1).join(': '); // Handles URLs containing colons
            
            const btn = document.createElement('a');
            btn.className = 'action-button';
            btn.href = value.trim();
            btn.target = "_blank"; // Open in new tab
            
            let icon = '<i class="fa-solid fa-link"></i>';
            const pLower = platform.toLowerCase();
            
            if(pLower.includes('instagram')) icon = '<i class="fa-brands fa-instagram"></i>';
            if(pLower.includes('facebook')) icon = '<i class="fa-brands fa-facebook"></i>';
            if(pLower.includes('telegram')) icon = '<i class="fa-brands fa-telegram"></i>';
            if(pLower.includes('whatsapp')) icon = '<i class="fa-brands fa-whatsapp"></i>';
            if(pLower.includes('tiktok')) icon = '<i class="fa-brands fa-tiktok"></i>';
            if(pLower.includes('youtube')) icon = '<i class="fa-brands fa-youtube"></i>';

            btn.innerHTML = `${icon} ${platform}`;
            linksBox.appendChild(btn);
        });
    }
</script>

</body>
</html>
