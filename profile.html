<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect</title>
    <style>
        body { font-family: sans-serif; background: #f3f4f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 24px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 90%; max-width: 400px; }
        .avatar { width: 80px; height: 80px; background: #4f46e5; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: bold; margin: 0 auto 20px; overflow: hidden; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        h1 { font-size: 1.5rem; margin-bottom: 10px; color: #1e293b; }
        .link-btn { display: block; padding: 15px; margin: 10px 0; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; text-decoration: none; color: #334155; font-weight: 600; }
    </style>
</head>
<body>

<div class="card">
    <div id="avatar-box" class="avatar">?</div>
    <h1 id="display-name">Loading...</h1>
    <div id="links-container"></div>
</div>

<script>
    window.onload = function() {
        const params = new URLSearchParams(window.location.search);
        const name = params.get('name') || "Welcome";
        const logo = params.get('logo');
        const data = params.get('data');

        // 1. Set the Name
        document.getElementById('display-name').innerText = name;

        // 2. Set Avatar (Image or First Letter)
        const avatarBox = document.getElementById('avatar-box');
        if (logo && logo.startsWith('http')) {
            avatarBox.innerHTML = `<img src="${logo}">`;
        } else {
            avatarBox.innerText = name.charAt(0).toUpperCase();
        }

        // 3. Generate Links
        if (data) {
            const container = document.getElementById('links-container');
            const parts = data.split('|');
            parts.forEach(p => {
                const [type, val] = p.split(':');
                if (val && val !== 'undefined') {
                    const btn = document.createElement('a');
                    btn.className = 'link-btn';
                    btn.innerText = type === 'TG' ? 'Telegram' : type === 'IG' ? 'Instagram' : 'WhatsApp';
                    btn.href = type === 'TG' ? `https://t.me/${val}` : type === 'IG' ? `https://instagram.com/${val}` : `https://wa.me/${val}`;
                    container.appendChild(btn);
                }
            });
        }
    }
</script>
</body>
</html>
