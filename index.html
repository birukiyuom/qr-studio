<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Enterprise QR Studio - Final Edition</title>
    <script type="text/javascript" src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
    <style>
        :root { --primary: #4f46e5; --bg: #f3f4f6; --text: #1e293b; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .dashboard { max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: 240px 1.2fr 1fr; gap: 20px; }
        
        /* Sidebar: Projects */
        .sidebar { background: #fff; border-radius: 16px; padding: 20px; border: 1px solid #e2e8f0; height: 90vh; overflow-y: auto; }
        .project-card { padding: 12px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; margin-bottom: 10px; cursor: pointer; font-size: 0.8rem; position: relative; transition: 0.2s; }
        .project-card:hover { border-color: var(--primary); background: #eff6ff; }
        .del-btn { position: absolute; right: 8px; top: 8px; color: #ef4444; border: none; background: none; cursor: pointer; font-weight: bold; }

        /* Main Editor */
        .editor { background: #fff; border-radius: 16px; border: 1px solid #e2e8f0; overflow: hidden; display: flex; flex-direction: column; }
        .tabs { display: flex; background: #f8fafc; border-bottom: 1px solid #e2e8f0; }
        .tab { flex: 1; padding: 18px; text-align: center; cursor: pointer; font-weight: 700; font-size: 0.75rem; color: #64748b; }
        .tab.active { background: #fff; color: var(--primary); border-bottom: 3px solid var(--primary); }
        
        .content { padding: 25px; flex-grow: 1; overflow-y: auto; }
        .scroll-box { max-height: 300px; overflow-y: auto; padding-right: 10px; margin-bottom: 20px; border-bottom: 1px solid #f1f5f9; }

        /* Inputs */
        label { display: block; font-size: 0.65rem; font-weight: 800; margin-bottom: 6px; color: #64748b; text-transform: uppercase; }
        input, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; margin-bottom: 15px; font-size: 0.85rem; box-sizing: border-box; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

        /* Preview Area */
        .preview-pane { background: #fff; border-radius: 16px; border: 1px solid #e2e8f0; padding: 35px; text-align: center; position: sticky; top: 20px; height: fit-content; }
        #canvas { margin: 25px 0; display: inline-block; }
        .btn-save { background: #10b981; color: white; border: none; padding: 14px; border-radius: 10px; width: 100%; font-weight: 700; cursor: pointer; margin-bottom: 10px; }
        .btn-dl { background: var(--primary); color: white; border: none; padding: 14px; border-radius: 10px; width: 100%; font-weight: 700; cursor: pointer; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="sidebar">
        <h3 style="margin-top:0">My Designs</h3>
        <div id="project-list"></div>
    </div>

    <div class="editor">
        <div class="tabs">
            <div class="tab active" onclick="switchTab('url')">WEBSITE</div>
            <div class="tab" onclick="switchTab('social')">SOCIAL HUB</div>
            <div class="tab" onclick="switchTab('text')">MESSAGE</div>
        </div>

        <div class="content">
            <div id="tab-url">
                <label>Destination Link</label>
                <input type="text" id="url-val" placeholder="https://instagram.com/..." oninput="updateLive()">
            </div>

            <div id="tab-social" class="hidden">
                <div class="scroll-box">
                    <label>Instagram</label><input type="text" id="s-ig" placeholder="@username" oninput="updateLive()">
                    <label>TikTok</label><input type="text" id="s-tt" placeholder="@username" oninput="updateLive()">
                    <label>YouTube</label><input type="text" id="s-yt" placeholder="Channel Link" oninput="updateLive()">
                    <label>Telegram</label><input type="text" id="s-tg" placeholder="t.me/user" oninput="updateLive()">
                    <label>WhatsApp</label><input type="text" id="s-wa" placeholder="Phone Number" oninput="updateLive()">
                </div>
            </div>

            <div id="tab-text" class="hidden">
                <label>Plain Text Content</label>
                <input type="text" id="text-val" placeholder="Write something..." oninput="updateLive()">
            </div>

            <div style="background:#f8fafc; padding:20px; border-radius:12px; border:1px solid #e2e8f0;">
                <label style="color:var(--primary)">Design Customization</label>
                <div class="grid-2">
                    <div><label>QR Color</label><input type="color" id="qr-color" value="#4f46e5" oninput="updateLive()"></div>
                    <div><label>Background</label><input type="color" id="qr-bg" value="#ffffff" oninput="updateLive()"></div>
                    <div><label>Dot Style</label><select id="qr-dots" onchange="updateLive()"><option value="classy">Classy</option><option value="rounded">Rounded</option><option value="square">Square</option></select></div>
                    <div><label>Eye Shape</label><select id="qr-eyes" onchange="updateLive()"><option value="extra-rounded">Rounded</option><option value="square">Square</option></select></div>
                </div>

                <label style="margin-top:15px">Branding (Logos & Backgrounds)</label>
                <div class="grid-2">
                    <div><label>Center Logo</label><input type="file" id="qr-logo-file" accept="image/*" onchange="updateLive()"></div>
                    <div><label>BG Image</label><input type="file" id="qr-bg-file" accept="image/*" onchange="updateLive()"></div>
                </div>
            </div>

            <div style="margin-top:20px">
                <label>Save Project As:</label>
                <input type="text" id="proj-name" placeholder="E.g. Business Card QR">
            </div>
        </div>
    </div>

    <div class="preview-pane">
        <label>Professional Preview</label>
        <div id="canvas"></div>
        <button class="btn-save" onclick="saveProject()">Save Project</button>
        <button class="btn-dl" onclick="download()">Download PNG</button>
    </div>
</div>

<script>
    let currentMode = 'url';
    let currentLogoBase64 = null;
    let currentBgBase64 = null;

    const qrCode = new QRCodeStyling({
        width: 300, height: 300,
        dotsOptions: { color: "#4f46e5", type: "classy" },
        cornersSquareOptions: { type: "extra-rounded" },
        backgroundOptions: { color: "#ffffff" },
        imageOptions: { crossOrigin: "anonymous", margin: 10, imageSize: 0.4 }
    });
    qrCode.append(document.getElementById("canvas"));

    function switchTab(mode) {
        currentMode = mode;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        event.currentTarget.classList.add('active');
        ['url','social','text'].forEach(m => document.getElementById('tab-'+m).classList.add('hidden'));
        document.getElementById('tab-'+mode).classList.remove('hidden');
        updateLive();
    }

    async function updateLive() {
    let val = "";
    
    if (currentMode === 'url') {
        val = document.getElementById('url-val').value || "https://google.com";
    } 
    else if (currentMode === 'social') {
        // 1. Collect all the links
        const links = [
            {n: 'Instagram', v: document.getElementById('s-ig').value},
            {n: 'TikTok', v: document.getElementById('s-tt').value},
            {n: 'YouTube', v: document.getElementById('s-yt').value},
            {n: 'Telegram', v: document.getElementById('s-tg').value},
            {n: 'WhatsApp', v: document.getElementById('s-wa').value}
        ].filter(link => link.v); // Only keep the ones that aren't empty

        // 2. Format them into a string
        const dataString = links.map(l => `${l.n}: ${l.v}`).join(' | ');

        // 3. Point to your profile.html page
        // Change "profile.html" to your full website URL once you host it!
        const profilePage = "profile.html"; 
        
        val = `${profilePage}?data=${encodeURIComponent(dataString)}`;
    } 
    else {
        val = document.getElementById('text-val').value || " ";
    }

    // ... (rest of your update code for logo/background remains the same)
    const logoIn = document.getElementById('qr-logo-file').files[0];
    const bgIn = document.getElementById('qr-bg-file').files[0];
    if(logoIn) currentLogoBase64 = await readFile(logoIn);
    if(bgIn) currentBgBase64 = await readFile(bgIn);

    qrCode.update({
        data: val,
        dotsOptions: { color: document.getElementById('qr-color').value, type: document.getElementById('qr-dots').value },
        backgroundOptions: { 
            color: currentBgBase64 ? 'transparent' : document.getElementById('qr-bg').value,
            source: currentBgBase64 
        },
        cornersSquareOptions: { type: document.getElementById('qr-eyes').value },
        image: currentLogoBase64
    });
}

    function readFile(file) {
        return new Promise(res => {
            const r = new FileReader();
            r.onload = () => res(r.result);
            r.readAsDataURL(file);
        });
    }

    // SAVING LOGIC
    function saveProject() {
        const project = {
            name: document.getElementById('proj-name').value || "Untitled",
            mode: currentMode,
            url: document.getElementById('url-val').value,
            socials: {
                ig: document.getElementById('s-ig').value,
                tt: document.getElementById('s-tt').value,
                yt: document.getElementById('s-yt').value,
                tg: document.getElementById('s-tg').value,
                wa: document.getElementById('s-wa').value
            },
            text: document.getElementById('text-val').value,
            color: document.getElementById('qr-color').value,
            bgColor: document.getElementById('qr-bg').value,
            dots: document.getElementById('qr-dots').value,
            eye: document.getElementById('qr-eyes').value,
            logo: currentLogoBase64,
            bgImg: currentBgBase64
        };

        let projects = JSON.parse(localStorage.getItem('enterprise_qrs') || "[]");
        projects.unshift(project);
        localStorage.setItem('enterprise_qrs', JSON.stringify(projects));
        renderProjects();
    }

    function renderProjects() {
        const projects = JSON.parse(localStorage.getItem('enterprise_qrs') || "[]");
        const list = document.getElementById('project-list');
        list.innerHTML = projects.map((p, i) => `
            <div class="project-card" onclick="loadProject(${i})">
                <strong>${p.name}</strong><br><small>${p.mode.toUpperCase()}</small>
                <button class="del-btn" onclick="deleteProj(${i}, event)">×</button>
            </div>
        `).join('');
    }

    function loadProject(i) {
        const p = JSON.parse(localStorage.getItem('enterprise_qrs'))[i];
        document.getElementById('proj-name').value = p.name;
        document.getElementById('url-val').value = p.url;
        document.getElementById('s-ig').value = p.socials.ig;
        document.getElementById('s-tt').value = p.socials.tt;
        document.getElementById('s-yt').value = p.socials.yt;
        document.getElementById('s-tg').value = p.socials.tg;
        document.getElementById('s-wa').value = p.socials.wa;
        document.getElementById('text-val').value = p.text;
        document.getElementById('qr-color').value = p.color;
        document.getElementById('qr-bg').value = p.bgColor;
        document.getElementById('qr-dots').value = p.dots;
        document.getElementById('qr-eyes').value = p.eye;
        currentLogoBase64 = p.logo;
        currentBgBase64 = p.bgImg;
        updateLive();
    }

    function deleteProj(i, e) {
        e.stopPropagation();
        let projects = JSON.parse(localStorage.getItem('enterprise_qrs'));
        projects.splice(i, 1);
        localStorage.setItem('enterprise_qrs', JSON.stringify(projects));
        renderProjects();
    }

    function download() { qrCode.download({ name: "pro-qr", extension: "png" }); }

    renderProjects();
    updateLive();
</script>
</body>
</html>
