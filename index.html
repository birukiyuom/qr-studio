<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise QR Studio - Professional Edition</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="text/javascript" src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
    <style>
        :root { 
            --primary: #6366f1; 
            --bg-dark: #0f172a;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --success: #10b981;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            background-attachment: fixed;
            color: var(--text-main); 
            margin: 0; 
            padding: 20px; 
            min-height: 100vh;
        }

        .dashboard { 
            max-width: 1500px; 
            margin: 0 auto; 
            display: grid; 
            grid-template-columns: 280px 1.2fr 1fr; 
            gap: 25px; 
        }

        .glass-panel {
            background: var(--glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        /* Sidebar Styles */
        .sidebar { height: 90vh; display: flex; flex-direction: column; padding: 20px; }
        #project-list { overflow-y: auto; flex-grow: 1; margin-top: 15px; }
        
        .project-card { 
            padding: 15px; 
            background: rgba(255, 255, 255, 0.05); 
            border: 1px solid var(--glass-border); 
            border-radius: 14px; 
            margin-bottom: 12px; 
            cursor: pointer; 
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.3s; 
        }
        .project-card:hover { 
            background: rgba(99, 102, 241, 0.15); 
            border-color: var(--primary);
        }
        .del-btn { color: #ef4444; border: none; background: none; cursor: pointer; }

        /* Tabs & Content */
        .editor { display: flex; flex-direction: column; height: 90vh; }
        .tabs { display: flex; background: rgba(0, 0, 0, 0.2); padding: 8px; gap: 8px; }
        .tab { 
            flex: 1; padding: 14px; text-align: center; cursor: pointer; 
            font-weight: 700; font-size: 0.7rem; color: var(--text-dim); 
            border-radius: 12px; transition: 0.3s;
        }
        .tab.active { background: var(--primary); color: white; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4); }
        
        .content { padding: 30px; flex-grow: 1; overflow-y: auto; }
        .scroll-box { 
            max-height: 280px; overflow-y: auto; padding: 15px; 
            background: rgba(0,0,0,0.2); border-radius: 12px;
        }

        /* Form Elements */
        label { display: block; font-size: 0.65rem; font-weight: 800; margin-bottom: 8px; color: var(--primary); text-transform: uppercase; letter-spacing: 1.5px; }
        input, select { 
            width: 100%; padding: 12px; background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border); border-radius: 10px; 
            margin-bottom: 15px; font-size: 0.9rem; color: white; box-sizing: border-box;
        }
        input:focus { border-color: var(--primary); outline: none; }

        /* Preview Area */
        .preview-pane { padding: 40px; text-align: center; height: 90vh; display: flex; flex-direction: column; justify-content: center; }
        #canvas { margin: 25px 0; background: white; padding: 20px; border-radius: 20px; display: inline-block; box-shadow: 0 20px 50px rgba(0,0,0,0.6); }

        .btn-save { background: var(--success); color: white; border: none; padding: 16px; border-radius: 14px; width: 100%; font-weight: 700; cursor: pointer; margin-bottom: 15px; transition: 0.3s; }
        .btn-dl { background: var(--primary); color: white; border: none; padding: 14px; border-radius: 12px; width: 100%; font-weight: 700; cursor: pointer; transition: 0.3s; }
        
        .hidden { display: none; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="glass-panel sidebar">
        <h3 style="margin:0;"><i class="fa-solid fa-folder-open"></i> My Designs</h3>
        <div id="project-list"></div>
    </div>

    <div class="glass-panel editor">
        <div class="tabs">
            <div class="tab active" id="tab-btn-url" onclick="switchTab('url')">WEBSITE</div>
            <div class="tab" id="tab-btn-social" onclick="switchTab('social')">SOCIAL HUB</div>
            <div class="tab" id="tab-btn-text" onclick="switchTab('text')">MESSAGE</div>
        </div>

        <div class="content">
            <div id="tab-url">
                <label>Destination Link</label>
                <input type="text" id="url-val" placeholder="https://example.com" oninput="updateLive()">
            </div>

            <div id="tab-social" class="hidden">
                <label>Branding</label>
                <div class="grid-2">
                    <input type="text" id="client-name" placeholder="Name" oninput="updateLive()">
                    <input type="text" id="client-slogan" placeholder="Tagline" oninput="updateLive()">
                </div>
                <label>Logo URL</label>
                <input type="text" id="client-logo-url" placeholder="Direct Image Link" oninput="updateLive()">

                <label>Connections</label>
                <div class="scroll-box">
                    <input type="text" id="s-ig" placeholder="Instagram @username" oninput="updateLive()">
                    <input type="text" id="s-tt" placeholder="TikTok @username" oninput="updateLive()">
                    <input type="text" id="s-yt" placeholder="YouTube Link" oninput="updateLive()">
                    <input type="text" id="s-tg" placeholder="Telegram t.me/user" oninput="updateLive()">
                    <input type="text" id="s-wa" placeholder="WhatsApp Number" oninput="updateLive()">
                </div>
            </div>

            <div id="tab-text" class="hidden">
                <label>Text Content</label>
                <input type="text" id="text-val" placeholder="Write something..." oninput="updateLive()">
            </div>

            <label>Brand Presets</label>
            <div class="grid-2" style="margin-bottom: 20px;">
                <button onclick="applyPreset('biruk')" style="background:#4f46e5; border:none; color:white; padding:10px; border-radius:8px; cursor:pointer;">BIRUK DESIGN</button>
                <button onclick="applyPreset('burka')" style="background:#78350f; border:none; color:white; padding:10px; border-radius:8px; cursor:pointer;">BURKA COFFEE</button>
            </div>

            <div style="background: rgba(255,255,255,0.03); padding:20px; border-radius:18px;">
                <label>QR Customization</label>
                <div class="grid-2">
                    <div><label>Color</label><input type="color" id="qr-color" value="#6366f1" oninput="updateLive()"></div>
                    <div><label>Background</label><input type="color" id="qr-bg" value="#ffffff" oninput="updateLive()"></div>
                    <div><label>Dots</label>
                        <select id="qr-dots" onchange="updateLive()">
                            <option value="square">Square</option>
                            <option value="classy">Premium</option>
                            <option value="extra-rounded">Dots</option>
                        </select>
                    </div>
                    <div><label>Eyes</label>
                        <select id="qr-eyes" onchange="updateLive()">
                            <option value="extra-rounded">Rounded</option>
                            <option value="square">Square</option>
                        </select>
                    </div>
                </div>
            </div>

            <label style="margin-top:20px">Project Name</label>
            <input type="text" id="proj-name" placeholder="E.g. Business QR">
        </div>
    </div>

    <div class="glass-panel preview-pane">
        <label>Professional Preview</label>
        <div id="canvas"></div>
        <button class="btn-save" onclick="saveProject()"><i class="fa-solid fa-floppy-disk"></i> Save to Studio</button>
        <div class="grid-2">
            <button class="btn-dl" onclick="download('png')">PNG</button>
            <button class="btn-dl" onclick="download('svg')" style="background:#4f46e5">SVG</button>
        </div>
    </div>
</div>

<script>
    let currentMode = 'url';
    let currentLogoBase64 = null;
    let currentBgBase64 = null;

    const qrCode = new QRCodeStyling({
        width: 300, height: 300, type: "svg",
        qrOptions: { errorCorrectionLevel: "H" },
        dotsOptions: { color: "#6366f1", type: "square" },
        cornersSquareOptions: { type: "extra-rounded" },
        backgroundOptions: { color: "#ffffff" },
        imageOptions: { crossOrigin: "anonymous", margin: 5, imageSize: 0.4 }
    });
    qrCode.append(document.getElementById("canvas"));

    function switchTab(mode) {
        currentMode = mode;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(`tab-btn-${mode}`).classList.add('active');
        ['url','social','text'].forEach(m => document.getElementById('tab-'+m).classList.add('hidden'));
        document.getElementById('tab-'+mode).classList.remove('hidden');
        updateLive();
    }

    function applyPreset(brand) {
        if (brand === 'biruk') {
            document.getElementById('qr-color').value = "#4f46e5";
            document.getElementById('qr-dots').value = "square";
            document.getElementById('proj-name').value = "Biruk Design Portfolio";
        } else if (brand === 'burka') {
            document.getElementById('qr-color').value = "#3e2723";
            document.getElementById('qr-dots').value = "classy";
            document.getElementById('proj-name').value = "Burka Coffee Branding";
        }
        updateLive();
    }

    function updateLive() {
        let val = "";
        if (currentMode === 'url') {
            val = document.getElementById('url-val').value || "https://google.com";
        } else if (currentMode === 'social') {
            const profilePage = "https://birukiyuom.github.io/qr-studio/profile.html"; 
            const name = document.getElementById('client-name').value || "Enterprise Hub";
            const slogan = document.getElementById('client-slogan').value || "Innovative Solutions";
            const logoURL = document.getElementById('client-logo-url').value || "";
            val = `${profilePage}?name=${encodeURIComponent(name)}&slogan=${encodeURIComponent(slogan)}&logo=${encodeURIComponent(logoURL)}`;
        } else {
            val = document.getElementById('text-val').value || " ";
        }

        qrCode.update({
            data: val,
            dotsOptions: { color: document.getElementById('qr-color').value, type: document.getElementById('qr-dots').value },
            backgroundOptions: { color: document.getElementById('qr-bg').value },
            cornersSquareOptions: { type: document.getElementById('qr-eyes').value, color: document.getElementById('qr-color').value }
        });
    }

    function saveProject() {
        const project = {
            name: document.getElementById('proj-name').value || "Untitled",
            mode: currentMode,
            design: { color: document.getElementById('qr-color').value, dots: document.getElementById('qr-dots').value }
        };
        let projects = JSON.parse(localStorage.getItem('enterprise_qrs') || "[]");
        projects.unshift(project);
        localStorage.setItem('enterprise_qrs', JSON.stringify(projects));
        renderProjects();
        alert("Project Saved!");
    }

    function renderProjects() {
        const projects = JSON.parse(localStorage.getItem('enterprise_qrs') || "[]");
        document.getElementById('project-list').innerHTML = projects.map((p, i) => `
            <div class="project-card">
                <div><strong>${p.name}</strong><br><small>${p.mode.toUpperCase()}</small></div>
                <button class="del-btn" onclick="deleteProj(${i}, event)"><i class="fa-solid fa-trash"></i></button>
            </div>`).join('');
    }

    function deleteProj(i, e) {
        e.stopPropagation();
        let projects = JSON.parse(localStorage.getItem('enterprise_qrs'));
        projects.splice(i, 1);
        localStorage.setItem('enterprise_qrs', JSON.stringify(projects));
        renderProjects();
    }

    function download(format) {
        qrCode.download({ name: document.getElementById('proj-name').value || "qr", extension: format });
    }

    renderProjects();
    updateLive();
</script>
</body>
</html>
