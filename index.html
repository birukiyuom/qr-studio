<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise QR Studio - Professional Edition</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="text/javascript" src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
    <style>
        :root { --primary: #4f46e5; --bg: #f3f4f6; --text: #1e293b; --success: #10b981; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .dashboard { max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: 260px 1.2fr 1fr; gap: 20px; }
        
        /* Sidebar: Projects */
        .sidebar { background: #fff; border-radius: 16px; padding: 20px; border: 1px solid #e2e8f0; height: 90vh; overflow-y: auto; }
        .project-card { padding: 12px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; margin-bottom: 10px; cursor: pointer; font-size: 0.8rem; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; }
        .project-card:hover { border-color: var(--primary); background: #eff6ff; }
        .del-btn { color: #ef4444; border: none; background: none; cursor: pointer; padding: 5px; }

        /* Main Editor */
        .editor { background: #fff; border-radius: 16px; border: 1px solid #e2e8f0; overflow: hidden; display: flex; flex-direction: column; height: 90vh; }
        .tabs { display: flex; background: #f8fafc; border-bottom: 1px solid #e2e8f0; }
        .tab { flex: 1; padding: 18px; text-align: center; cursor: pointer; font-weight: 700; font-size: 0.75rem; color: #64748b; border-bottom: 3px solid transparent; }
        .tab.active { background: #fff; color: var(--primary); border-bottom-color: var(--primary); }
        
        .content { padding: 25px; flex-grow: 1; overflow-y: auto; }
        .scroll-box { max-height: 280px; overflow-y: auto; padding-right: 10px; margin-bottom: 20px; border-bottom: 1px solid #f1f5f9; }

        /* Inputs */
        label { display: block; font-size: 0.65rem; font-weight: 800; margin-bottom: 6px; color: #64748b; text-transform: uppercase; margin-top: 10px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; margin-bottom: 12px; font-size: 0.85rem; box-sizing: border-box; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        /* Presets */
        .preset-btn { border: none; padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 0.65rem; color: white; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
        .preset-btn:hover { opacity: 0.9; transform: translateY(-1px); }

        /* Preview Area */
        .preview-pane { background: #fff; border-radius: 16px; border: 1px solid #e2e8f0; padding: 30px; text-align: center; position: sticky; top: 20px; height: fit-content; }
        #canvas { margin: 20px 0; background: #f8fafc; padding: 15px; border-radius: 12px; display: inline-block; }
        .btn-save { background: var(--success); color: white; border: none; padding: 14px; border-radius: 10px; width: 100%; font-weight: 700; cursor: pointer; margin-bottom: 10px; }
        .btn-dl { background: var(--primary); color: white; border: none; padding: 14px; border-radius: 10px; width: 100%; font-weight: 700; cursor: pointer; }
        .btn-svg { background: #6366f1; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="sidebar">
        <h3 style="margin-top:0; font-size: 1rem;"><i class="fa-solid fa-folder-open"></i> My Designs</h3>
        <div id="project-list"></div>
    </div>

    <div class="editor">
        <div class="tabs">
            <div class="tab active" onclick="switchTab('url')">WEBSITE</div>
            <div class="tab" onclick="switchTab('social')">SOCIAL HUB</div>
            <div class="tab" onclick="switchTab('text')">MESSAGE</div>
        </div>

        <div class="content">
            <div id="tab-url">
                <label>Destination Link</label>
                <input type="text" id="url-val" placeholder="https://example.com" oninput="updateLive()">
            </div>

            <div id="tab-social" class="hidden">
                <div class="scroll-box">
                    <label>Instagram</label><input type="text" id="s-ig" placeholder="@username" oninput="updateLive()">
                    <label>TikTok</label><input type="text" id="s-tt" placeholder="@username" oninput="updateLive()">
                    <label>YouTube</label><input type="text" id="s-yt" placeholder="Channel Link" oninput="updateLive()">
                    <label>Telegram</label><input type="text" id="s-tg" placeholder="t.me/user" oninput="updateLive()">
                    <label>WhatsApp</label><input type="text" id="s-wa" placeholder="Phone Number" oninput="updateLive()">
                    <label>Facebook</label><input type="text" id="s-fb" placeholder="Link" oninput="updateLive()">
                    <label>LinkedIn</label><input type="text" id="s-li" placeholder="Link" oninput="updateLive()">
                    <label>X (Twitter)</label><input type="text" id="s-x" placeholder="Link" oninput="updateLive()">
                    <label>Portfolio</label><input type="text" id="s-port" placeholder="yourwebsite.com" oninput="updateLive()">
                </div>
            </div>

            <div id="tab-text" class="hidden">
                <label>Plain Text Content</label>
                <input type="text" id="text-val" placeholder="Write something..." oninput="updateLive()">
            </div>

            <label style="color:var(--primary)">Quick Brand Presets</label>
            <div class="grid-2" style="margin-bottom: 20px;">
                <button type="button" class="preset-btn" onclick="applyPreset('biruk')" style="background: #4f46e5;">
                    <i class="fa-solid fa-user-tie"></i> BIRUK DESIGN
                </button>
                <button type="button" class="preset-btn" onclick="applyPreset('burka')" style="background: #78350f;">
                    <i class="fa-solid fa-mug-hot"></i> BURKA COFFEE
                </button>
                <button type="button" class="preset-btn" onclick="applyPreset('survey')" style="background: #1e293b;">
                    <i class="fa-solid fa-compass-drafting"></i> TECH SURVEY
                </button>
            </div>

            <div style="background:#f8fafc; padding:20px; border-radius:12px; border:1px solid #e2e8f0;">
                <label style="color:var(--primary); margin:0 0 15px 0">Design Customization</label>
                <div class="grid-2">
                    <div><label>QR Color</label><input type="color" id="qr-color" value="#4f46e5" oninput="updateLive()"></div>
                    <div><label>Background</label><input type="color" id="qr-bg" value="#ffffff" oninput="updateLive()"></div>
                    <div>
                        <label>Dot Style</label>
                        <select id="qr-dots" onchange="updateLive()">
                            <option value="square">Square</option>
                            <option value="classy">Classy</option>
                            <option value="rounded">Rounded</option>
                            <option value="extra-rounded">Dots</option>
                        </select>
                    </div>
                    <div>
                        <label>Eye Shape</label>
                        <select id="qr-eyes" onchange="updateLive()">
                            <option value="extra-rounded">Rounded</option>
                            <option value="square">Square</option>
                        </select>
                    </div>
                </div>

                <label style="margin-top:15px">Logo & Background Image</label>
                <div class="grid-2">
                    <div><label>Center Logo</label><input type="file" id="qr-logo-file" accept="image/*" onchange="updateLive()"></div>
                    <div><label>Background</label><input type="file" id="qr-bg-file" accept="image/*" onchange="updateLive()"></div>
                </div>
            </div>

            <div style="margin-top:20px">
                <label>Project Name</label>
                <input type="text" id="proj-name" placeholder="E.g. Business Card QR">
            </div>
        </div>
    </div>

    <div class="preview-pane">
        <label>Professional Preview</label>
        <div id="canvas"></div>
        <button class="btn-save" onclick="saveProject()"><i class="fa-solid fa-floppy-disk"></i> Save to Studio</button>
        <div class="grid-2">
            <button class="btn-dl" onclick="download('png')">PNG</button>
            <button class="btn-dl btn-svg" onclick="download('svg')">SVG (Vector)</button>
        </div>
        <p style="font-size: 0.6rem; color: #94a3b8; margin-top: 15px;">SVG is recommended for professional printing.</p>
    </div>
</div>

<script>
    let currentMode = 'url';
    let currentLogoBase64 = null;
    let currentBgBase64 = null;

    const qrCode = new QRCodeStyling({
        width: 300, 
        height: 300,
        type: "svg",
        qrOptions: { errorCorrectionLevel: "H" }, // High correction for logos
        dotsOptions: { color: "#4f46e5", type: "square" },
        cornersSquareOptions: { type: "extra-rounded" },
        backgroundOptions: { color: "#ffffff" },
        imageOptions: { crossOrigin: "anonymous", margin: 8, imageSize: 0.4 }
    });
    qrCode.append(document.getElementById("canvas"));

    function switchTab(mode) {
        currentMode = mode;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        event.currentTarget.classList.add('active');
        ['url','social','text'].forEach(m => document.getElementById('tab-'+m).classList.add('hidden'));
        document.getElementById('tab-'+mode).classList.remove('hidden');
        updateLive();
    }

    function applyPreset(brand) {
        if (brand === 'biruk') {
            document.getElementById('qr-color').value = "#4f46e5";
            document.getElementById('qr-bg').value = "#ffffff";
            document.getElementById('qr-dots').value = "square";
            document.getElementById('qr-eyes').value = "extra-rounded";
            document.getElementById('proj-name').value = "Biruk Design Portfolio";
            document.getElementById('s-tg').value = "t.me/biruk_girma";
        } 
        else if (brand === 'burka') {
            document.getElementById('qr-color').value = "#3e2723";
            document.getElementById('qr-bg').value = "#fffcf2";
            document.getElementById('qr-dots').value = "classy";
            document.getElementById('qr-eyes').value = "square";
            document.getElementById('proj-name').value = "Burka Coffee Branding";
        }
        else if (brand === 'survey') {
            document.getElementById('qr-color').value = "#000000";
            document.getElementById('qr-bg').value = "#ffffff";
            document.getElementById('qr-dots').value = "square";
            document.getElementById('qr-eyes').value = "square";
            document.getElementById('proj-name').value = "Technical Site Survey";
        }
        updateLive();
    }

    async function updateLive() {
        let val = "";
        if (currentMode === 'url') {
            val = document.getElementById('url-val').value || "https://google.com";
        } else if (currentMode === 'social') {
            const links = [
                {n: 'Instagram', v: document.getElementById('s-ig').value},
                {n: 'TikTok', v: document.getElementById('s-tt').value},
                {n: 'YouTube', v: document.getElementById('s-yt').value},
                {n: 'Telegram', v: document.getElementById('s-tg').value},
                {n: 'WhatsApp', v: document.getElementById('s-wa').value},
                {n: 'Facebook', v: document.getElementById('s-fb').value},
                {n: 'LinkedIn', v: document.getElementById('s-li').value},
                {n: 'X', v: document.getElementById('s-x').value},
                {n: 'Portfolio', v: document.getElementById('s-port').value}
            ].filter(link => link.v);
            const dataString = links.map(l => `${l.n}: ${l.v}`).join(' | ');
            const profilePage = "https://birukiyuom.github.io/qr-studio/profile.html"; 
            val = `${profilePage}?data=${encodeURIComponent(dataString)}&slogan=${encodeURIComponent(slogan)}&logo=${encodeURIComponent(logoURL)}`;
        } else {
            val = document.getElementById('text-val').value || " ";
        }

        const logoIn = document.getElementById('qr-logo-file').files[0];
        const bgIn = document.getElementById('qr-bg-file').files[0];
        if(logoIn) currentLogoBase64 = await readFile(logoIn);
        if(bgIn) currentBgBase64 = await readFile(bgIn);

        qrCode.update({
            data: val,
            dotsOptions: { color: document.getElementById('qr-color').value, type: document.getElementById('qr-dots').value },
            backgroundOptions: { 
                color: currentBgBase64 ? "rgba(0,0,0,0)" : document.getElementById('qr-bg').value,
                source: currentBgBase64 
            },
            cornersSquareOptions: { type: document.getElementById('qr-eyes').value },
            image: currentLogoBase64
        });
    }

    function readFile(file) {
        return new Promise(res => {
            const r = new FileReader();
            r.onload = () => res(r.result);
            r.readAsDataURL(file);
        });
    }

    function saveProject() {
        const project = {
            name: document.getElementById('proj-name').value || "Untitled",
            mode: currentMode,
            url: document.getElementById('url-val').value,
            socials: {
                ig: document.getElementById('s-ig').value, tt: document.getElementById('s-tt').value,
                tg: document.getElementById('s-tg').value, port: document.getElementById('s-port').value
            },
            color: document.getElementById('qr-color').value,
            bgColor: document.getElementById('qr-bg').value,
            dots: document.getElementById('qr-dots').value,
            eye: document.getElementById('qr-eyes').value
        };
        let projects = JSON.parse(localStorage.getItem('enterprise_qrs') || "[]");
        projects.unshift(project);
        localStorage.setItem('enterprise_qrs', JSON.stringify(projects));
        renderProjects();
        alert("Project Saved to Sidebar!");
    }

    function renderProjects() {
        const projects = JSON.parse(localStorage.getItem('enterprise_qrs') || "[]");
        const list = document.getElementById('project-list');
        list.innerHTML = projects.map((p, i) => `
            <div class="project-card" onclick="loadProject(${i})">
                <div><strong>${p.name}</strong><br><small>${p.mode.toUpperCase()}</small></div>
                <button class="del-btn" onclick="deleteProj(${i}, event)"><i class="fa-solid fa-trash"></i></button>
            </div>
        `).join('');
    }

    function loadProject(i) {
        const p = JSON.parse(localStorage.getItem('enterprise_qrs'))[i];
        document.getElementById('proj-name').value = p.name;
        document.getElementById('qr-color').value = p.color;
        document.getElementById('qr-bg').value = p.bgColor;
        document.getElementById('qr-dots').value = p.dots;
        document.getElementById('qr-eyes').value = p.eye;
        switchTab(p.mode);
    }

    function deleteProj(i, e) {
        e.stopPropagation();
        let projects = JSON.parse(localStorage.getItem('enterprise_qrs'));
        projects.splice(i, 1);
        localStorage.setItem('enterprise_qrs', JSON.stringify(projects));
        renderProjects();
    }

    function download(format) { 
        const name = document.getElementById('proj-name').value || "pro-qr";
        qrCode.download({ name: name, extension: format }); 
    }

    renderProjects();
    updateLive();
</script>
</body>
</html>
