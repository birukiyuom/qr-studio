<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise QR Studio - SaaS Edition</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="text/javascript" src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
    <style>
        :root { --primary: #4f46e5; --bg: #f3f4f6; --text: #1e293b; --success: #10b981; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .dashboard { max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: 260px 1.2fr 1fr; gap: 20px; }
        .sidebar { background: #fff; border-radius: 16px; padding: 20px; border: 1px solid #e2e8f0; height: 90vh; overflow-y: auto; }
        .project-card { padding: 12px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; margin-bottom: 10px; cursor: pointer; font-size: 0.8rem; display: flex; justify-content: space-between; align-items: center; }
        .editor { background: #fff; border-radius: 16px; border: 1px solid #e2e8f0; overflow: hidden; display: flex; flex-direction: column; height: 90vh; }
        .tabs { display: flex; background: #f8fafc; border-bottom: 1px solid #e2e8f0; }
        .tab { flex: 1; padding: 18px; text-align: center; cursor: pointer; font-weight: 700; font-size: 0.75rem; color: #64748b; }
        .tab.active { background: #fff; color: var(--primary); border-bottom: 3px solid var(--primary); }
        .content { padding: 25px; flex-grow: 1; overflow-y: auto; }
        label { display: block; font-size: 0.65rem; font-weight: 800; margin-bottom: 6px; color: #64748b; text-transform: uppercase; margin-top: 10px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; margin-bottom: 12px; font-size: 0.85rem; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .preview-pane { background: #fff; border-radius: 16px; border: 1px solid #e2e8f0; padding: 30px; text-align: center; position: sticky; top: 20px; }
        #canvas { margin: 20px 0; background: #f8fafc; padding: 15px; border-radius: 12px; display: inline-block; }
        .btn-dl { background: var(--primary); color: white; border: none; padding: 14px; border-radius: 10px; width: 100%; font-weight: 700; cursor: pointer; margin-top: 10px; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="sidebar">
        <h3 style="margin:0">My Designs</h3>
        <div id="project-list"></div>
    </div>

    <div class="editor">
        <div class="tabs">
            <div class="tab active" onclick="switchTab('url')">WEBSITE</div>
            <div class="tab" onclick="switchTab('social')">SOCIAL HUB</div>
        </div>

        <div class="content">
            <div id="tab-url">
                <label>Direct Link</label>
                <input type="text" id="url-val" placeholder="https://example.com" oninput="updateLive()">
            </div>

            <div id="tab-social" class="hidden">
                <label>Brand/User Name</label>
                <input type="text" id="client-name" placeholder="E.g. Burka Coffee" oninput="updateLive()">
                
                <label>Client Logo URL (Optional)</label>
                <input type="text" id="client-logo-url" placeholder="https://link-to-logo.png" oninput="updateLive()">

                <div style="max-height: 200px; overflow-y: auto; border: 1px solid #eee; padding: 10px; border-radius: 8px;">
                    <label>Telegram</label><input type="text" id="s-tg" placeholder="t.me/username" oninput="updateLive()">
                    <label>Instagram</label><input type="text" id="s-ig" placeholder="@username" oninput="updateLive()">
                    <label>WhatsApp</label><input type="text" id="s-wa" placeholder="Number" oninput="updateLive()">
                </div>
            </div>

            <label style="color:var(--primary); margin-top:20px;">QR Design</label>
            <div class="grid-2">
                <div><label>Color</label><input type="color" id="qr-color" value="#4f46e5" oninput="updateLive()"></div>
                <div><label>Dots</label><select id="qr-dots" onchange="updateLive()"><option value="square">Square</option><option value="classy">Classy</option></select></div>
            </div>
            
            <label>Project Name (For Studio)</label>
            <input type="text" id="proj-name" placeholder="Client Name">
        </div>
    </div>

    <div class="preview-pane">
        <label>Scan Preview</label>
        <div id="canvas"></div>
        <button class="btn-dl" onclick="download('png')">Download PNG</button>
        <button class="btn-dl" style="background:#10b981" onclick="saveProject()">Save Project</button>
    </div>
</div>

<script>
    let currentMode = 'url';
    const qrCode = new QRCodeStyling({
        width: 280, height: 280,
        qrOptions: { errorCorrectionLevel: "H" },
        dotsOptions: { color: "#4f46e5", type: "square" },
        backgroundOptions: { color: "#ffffff" }
    });
    qrCode.append(document.getElementById("canvas"));

    function switchTab(mode) {
        currentMode = mode;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        event.currentTarget.classList.add('active');
        document.getElementById('tab-url').classList.toggle('hidden', mode !== 'url');
        document.getElementById('tab-social').classList.toggle('hidden', mode !== 'social');
        updateLive();
    }

    function updateLive() {
        let val = "";
        if (currentMode === 'url') {
            val = document.getElementById('url-val').value || "https://google.com";
        } else {
            const name = document.getElementById('client-name').value || "Identity";
            const logo = document.getElementById('client-logo-url').value || "";
            const links = `TG:${document.getElementById('s-tg').value}|IG:${document.getElementById('s-ig').value}|WA:${document.getElementById('s-wa').value}`;
            
            // This builds the dynamic URL for the other person
            const base = "https://birukiyuom.github.io/qr-studio/profile.html";
            val = `${base}?name=${encodeURIComponent(name)}&logo=${encodeURIComponent(logo)}&data=${encodeURIComponent(links)}`;
        }

        qrCode.update({
            data: val,
            dotsOptions: { color: document.getElementById('qr-color').value, type: document.getElementById('qr-dots').value }
        });
    }

    function download(format) { qrCode.download({ name: "qr-code", extension: format }); }
    
    function saveProject() {
        const p = { name: document.getElementById('proj-name').value || "Unnamed" };
        let projects = JSON.parse(localStorage.getItem('qrs') || "[]");
        projects.push(p);
        localStorage.setItem('qrs', JSON.stringify(projects));
        alert("Project Saved!");
    }
</script>
</body>
</html>
